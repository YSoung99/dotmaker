<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트메이커</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3f1;
  --panel: #ffffff;
  --text: #1d1c1a;
  --muted: #6c6a66;
  --line: #dddad5;
  --control: #ffffff;
  --control-hover: #f1efec;
  --accent: #d94f8a;
  --accent-text: #ffffff;
  --checker-a: #f6f5f3;
  --checker-b: #e9e7e3;
  --error: #c4322f;
  --focus: #2f6fd6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b1a;
    --panel: #252422;
    --text: #ecebe8;
    --muted: #a3a09a;
    --line: #3b3936;
    --control: #2f2e2b;
    --control-hover: #393734;
    --accent: #e8679f;
    --checker-a: #2b2a28;
    --checker-b: #34322f;
    --error: #ff7b72;
    --focus: #79a8ff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  min-width: 320px;
}
button, input, select { font: inherit; color: inherit; }
button, select, input[type=text] {
  background: var(--control);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 12px;
  min-height: 32px;
}
button { cursor: pointer; }
button:hover:not(:disabled), select:hover:not(:disabled) { background: var(--control-hover); }
button:disabled, input:disabled, select:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=text] { width: 64px; text-align: center; padding: 5px 6px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
.muted { color: var(--muted); }

.toolbar { display: flex; align-items: center; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.toolbar .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.toolbar label { display: flex; align-items: center; gap: 6px; }
.brand { font-weight: 700; letter-spacing: -.01em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }

.tabs { display: flex; gap: 4px; padding: 14px 20px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; background: transparent; padding: 7px 18px; margin-bottom: -1px; }
.tabs button[aria-selected=true] { background: var(--panel); border-color: var(--line); font-weight: 600; }

main { flex: 1; display: flex; min-height: 0; background: var(--panel); }
.screen { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 18px; min-height: 0; }
.screen > p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 9px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.field { display: flex; align-items: center; gap: 8px; }
.note { margin: 0; color: var(--muted); font-size: 12.5px; }
.toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segmented button { border: none; border-radius: 0; border-left: 1px solid var(--line); background: var(--control); padding: 5px 14px; }
.segmented button:first-child { border-left: none; }
.segmented button[aria-checked=true] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper span { min-width: 92px; }
.stepper button { width: 32px; padding: 0; }
.stepper.disabled span { opacity: .45; }

.previews { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 240px; }
.preview { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
.preview header { display: flex; align-items: baseline; gap: 8px; }
.preview h3 { margin: 0; font-size: 14px; }
.preview .size { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.frame {
  flex: 1; min-height: 0; position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 24px 24px;
}
.frame canvas { position: absolute; inset: 15px; width: calc(100% - 30px); height: calc(100% - 30px); object-fit: contain; }
.frame canvas.pixelated { image-rendering: pixelated; }

.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  border: 1.5px dashed var(--line); border-radius: 10px; background: transparent; color: var(--muted); padding: 24px; min-height: 240px;
}
.empty strong { color: var(--text); font-size: 16px; }
body.dragging .empty.drop, body.dragging .frame { border-color: var(--accent); }

.status { margin: 0; min-height: 21px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; user-select: text; }
.status.error { color: var(--error); }
.spinner { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

input.key { width: 320px; text-align: left; }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 24px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(820px, 100%); max-height: 100%; overflow-y: auto;
  padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .3); }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet h3 { margin: 0; font-size: 14px; }
.jev-row { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.jev-row p { margin: 0; }
.jev-images { display: flex; gap: 10px; flex-wrap: wrap; }
.jev-images figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.jev-images img { width: 150px; height: 150px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; }
input.wide { width: min(520px, 100%); text-align: left; }
.screen select { min-height: 32px; }
.strip { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; }
.strip canvas { width: 48px; height: 48px; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
  background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px; }
.screen a { color: var(--focus); }
.help { overflow-y: auto; max-width: 980px; }
.help section { display: flex; flex-direction: column; gap: 8px; }
.help h2 { font-size: 16px; margin: 6px 0 0; }
.help p, .help ul { margin: 0; }
.help ul { padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.help code, .help kbd { font: 12.5px/1.4 ui-monospace, Consolas, "D2Coding", monospace; background: var(--control-hover); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.help a { color: var(--focus); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.files { border-collapse: collapse; width: 100%; font-size: 13px; }
.files th, .files td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.files tr:last-child td { border-bottom: none; }
.files th { color: var(--muted); font-weight: 600; background: var(--bg); }
.files .url { min-width: 260px; font-size: 12px; word-break: break-all; }
.files .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.files .ok { color: #2e8b57; font-weight: 600; white-space: nowrap; }
.files .missing { color: var(--muted); white-space: nowrap; }
@media (prefers-color-scheme: dark) { .files .ok { color: #6fd39b; } }

@media (max-width: 640px) {
  .previews { grid-template-columns: 1fr; }
  .toolbar, .tabs, .screen { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="toolbar">
  <span class="brand">도트메이커<small id="version"></small></span>
  <button id="open" type="button">이미지 열기…</button>
  <span id="file-name" class="name"></span>
  <label>저장 배율
    <select id="scale" title="도트 그림을 정수배로 키워 저장합니다(번짐 없음).">
      <option value="1">1배</option><option value="2">2배</option><option value="4">4배</option><option value="8">8배</option>
    </select>
  </label>
  <button id="save" type="button" disabled>PNG 저장…</button>
  <input id="file" type="file" accept="image/*" hidden>
</div>
<nav id="tabs" class="tabs" role="tablist" aria-label="단계">
  <button type="button" role="tab" data-stage="dot">도트화</button>
  <button type="button" role="tab" data-stage="repair">AI 보정</button>
  <button type="button" role="tab" data-stage="help">설명서</button>
</nav>
<main id="panel" role="tabpanel"></main>

async function download(id, progress) {
  const file = AI_FILES[id];
  const bytes = new Uint8Array(file.size);
  let received = 0, resumable = false;
  // 큰 모델은 받는 도중 연결이 끊기기 쉬워서, 끊기면 받은 데부터 이어받는다(최대 3번).
  // 압축해서 보내는 서버는 위치가 압축 전후로 달라 이어받을 수 없어 처음부터 다시 받는다.
  for (let attempt = 0; ; attempt++) {
    try {
      if (!resumable) received = 0;
      const response = await fetch(file.url, received ? { headers: { Range: `bytes=${received}-` } } : {});
      if (!response.ok) throw new DotError(`${file.title}을(를) 받지 못했습니다. (HTTP ${response.status})`);
      // 서버가 이어받기를 무시하고 처음부터 보내면 처음부터 다시 센다.
      if (received && response.status !== 206) received = 0;
      resumable = !response.headers.get('content-encoding') && response.headers.get('accept-ranges') === 'bytes';
      // CDN은 압축해서 보내기도 해서 content-length를 믿지 않고, 풀린 크기를 목록의 크기와 맞춰 본다.
      const reader = response.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        if (received + value.length > bytes.length) throw new DotError(`${file.title} 크기가 예상과 다릅니다.`);
        bytes.set(value, received);
        received += value.length;
        progress(`${file.title} 받는 중 (처음 한 번, ${Math.round(received / 1048576)}/${Math.round(file.size / 1048576)}MB)`);
      }
      break;
    } catch (error) {
      if (error instanceof DotError) throw error;
      if (attempt >= 3) throw new DotError(`${file.title}을(를) 받지 못했습니다. 인터넷 연결을 확인하거나, 설명서 탭에서 파일을 직접 받아 넣어 주세요.`);
      progress(`${file.title} 연결이 끊겨 이어받는 중 (${attempt + 1}/3)`);
      await new Promise(done => setTimeout(done, 1500 * (attempt + 1)));
    }
  }
  if (received !== file.size) throw new DotError(`${file.title} 크기가 예상과 다릅니다.`);
  return bytes;
}

async function aiFile(id, progress) {
  let bytes = await fileStore.get(id);
  if (!bytes) {
    bytes = await download(id, progress);
    await fileStore.put(id, bytes).catch(() => {});
  }
  return bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
}

const blobURL = (bytes, type) => URL.createObjectURL(new Blob([bytes], { type }));

let ortReady = null;
function loadOrt(progress) {
  ortReady ??= (async () => {
    const js = await aiFile('ortJs', progress);
    const mjs = await aiFile('ortMjs', progress);
    const wasm = await aiFile('ortWasm', progress);
    importScripts(blobURL(js, 'text/javascript'));
    self.ort.env.wasm.wasmPaths = { mjs: blobURL(mjs, 'text/javascript') };
    self.ort.env.wasm.wasmBinary = wasm;
    return self.ort;
  })().catch(error => { ortReady = null; throw error; });
  return ortReady;
}
const providers = () => (self.navigator.gpu ? ['webgpu', 'wasm'] : ['wasm']);

/** cv2.resize(INTER_LINEAR)와 같은 반 칸 기준 쌍선형. src: Float32Array(채널 c, HWC) */
function bilinear(src, sw, sh, dw, dh, c) {
  const out = new Float32Array(dw * dh * c);
  const sx = sw / dw, sy = sh / dh;
  for (let y = 0; y < dh; y++) {
    const fy = Math.min(sh - 1, Math.max(0, (y + 0.5) * sy - 0.5));
    const y0 = Math.floor(fy), y1 = Math.min(sh - 1, y0 + 1), ty = fy - y0;
    for (let x = 0; x < dw; x++) {
      const fx = Math.min(sw - 1, Math.max(0, (x + 0.5) * sx - 0.5));
      const x0 = Math.floor(fx), x1 = Math.min(sw - 1, x0 + 1), tx = fx - x0;
      for (let k = 0; k < c; k++) {
        const a = src[(y0 * sw + x0) * c + k], b = src[(y0 * sw + x1) * c + k];
        const d = src[(y1 * sw + x0) * c + k], e = src[(y1 * sw + x1) * c + k];
        out[(y * dw + x) * c + k] = (a + (b - a) * tx) * (1 - ty) + (d + (e - d) * tx) * ty;
      }
    }
  }
  return out;
}

/** 배경을 지운 이미지(프리멀티플라이 바이트, 원본과 같은 크기). image의 원본은 불투명. */
async function removeBackground(image, progress) {
  const session = await segmentationSession(progress);
  progress('AI가 배경을 지우는 중');
  const { w: w0, h: h0, data } = image, s = SEG_SIZE;
  const [h, w] = h0 > w0 ? [s, Math.trunc(s * w0 / h0)] : [Math.trunc(s * h0 / w0), s];
  const top = (s - h) >> 1, left = (s - w) >> 1;
  const rgb = new Float32Array(w0 * h0 * 3);
  for (let i = 0; i < w0 * h0; i++) {
    const a = data[i * 4 + 3] || 1;
    for (let k = 0; k < 3; k++) rgb[i * 3 + k] = Math.min(255, data[i * 4 + k] * 255 / a) / 255;
  }
  const scaled = bilinear(rgb, w0, h0, w, h, 3);
  const input = new Float32Array(3 * s * s);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    for (let k = 0; k < 3; k++) input[k * s * s + (y + top) * s + x + left] = scaled[(y * w + x) * 3 + k];
  }
  const feeds = { [session.inputNames[0]]: new self.ort.Tensor('float32', input, [1, 3, s, s]) };
  const output = (await session.run(feeds))[session.outputNames[0]].data;
  const crop = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) crop[y * w + x] = output[(y + top) * s + x + left];
  const mask = bilinear(crop, w, h, w0, h0, 1);
  const out = new Uint8Array(w0 * h0 * 4);
  // 모델은 몸통도 0.85~0.99로만 확신해서 그대로 쓰면 캐릭터 전체가 비친다(맥판과 같은 보정).
  // 0.8 이상은 불투명, 0.2 이하(흐린 배경 찌꺼기)는 투명, 그 사이만 반투명으로 편다.
  for (let i = 0; i < w0 * h0; i++) {
    const a = Math.round(Math.min(1, Math.max(0, (mask[i] - 0.2) / 0.6)) * 255);
    for (let k = 0; k < 3; k++) out[i * 4 + k] = Math.round(rgb[i * 3 + k] * a);
    out[i * 4 + 3] = a;
  }
  return { w: w0, h: h0, data: out };
}

// ── 선 추출
let linesSession = null;
async function lineSession(progress) {
  if (linesSession) return linesSession;
  const ort = await loadOrt(progress);
  const file = await aiFile('linesModel', progress);
  progress('선 추출 AI 모델 준비 중');
  const view = new DataView(file.buffer, file.byteOffset, file.byteLength);
  const headerLength = Number(view.getBigUint64(0, true));
  const header = JSON.parse(new TextDecoder().decode(file.subarray(8, 8 + headerLength)));
  const start = 8 + headerLength;
  const last = LINES_MANIFEST[LINES_MANIFEST.length - 1];
  const weights = new Uint8Array(last[1] + last[2] * 4);
  const out = new Uint32Array(weights.buffer);
  for (const [key, offset, count] of LINES_MANIFEST) {
    const info = header[key];
    if (!info || info.dtype !== 'BF16') throw new DotError('선 추출 AI 모델 파일이 예상과 다릅니다.');
    const base = start + info.data_offsets[0], first = offset / 4;
    // BF16은 Float32의 위쪽 16비트라서 16비트 밀어 올리면 같은 값이다.
    for (let k = 0; k < count; k++) out[first + k] = view.getUint16(base + k * 2, true) << 16;
  }
  const graph = Uint8Array.from(atob(LINES_GRAPH), c => c.charCodeAt(0));
  linesSession = await ort.InferenceSession.create(graph, {
    executionProviders: providers(),
    externalData: [{ path: 'weights.bin', data: weights }],
  });
  return linesSession;
}

/** 캐릭터(subject)의 구조선 지도: 흰 바탕에 검은 선, 캐릭터와 같은 크기. 맥판 AIDot.extractLines와 같은 입력·출력. */
async function extractLines(subject, progress) {
  const session = await lineSession(progress);
  progress('선 추출 AI가 원본의 선을 읽는 중');
  const w = subject.grid.w, h = subject.grid.h;
  const pw = Math.ceil(w / 16) * 16, ph = Math.ceil(h / 16) * 16;
  const input = new Float32Array(pw * ph).fill(255);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = subject.px[y * w + x], pct = Math.floor(A(p) * 100 / 255);
    const white = c => Math.floor((255 * (100 - pct) + c * pct + 50) / 100);
    // 흰 바탕에 얹은 뒤 PIL 'L' 변환과 같은 회색
    input[y * pw + x] = (white(R(p)) * 19595 + white(G(p)) * 38470 + white(B(p)) * 7471 + 0x8000) >> 16;
  }
  const tensor = new self.ort.Tensor('float32', input, [1, 1, ph, pw]);
  const output = (await session.run({ [session.inputNames[0]]: tensor }))[session.outputNames[0]].data;
  const lines = new Raster(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = Math.trunc(Math.min(255, Math.max(0, output[y * pw + x])));
    lines.px[y * w + x] = pack(v, v, v);
  }
  return lines;
}

// JEV(LLM Gateway 판정 모델)에 물을 항목 만들기. 작업자 안에서 돈다(맥 시험판 JevDetails.swift에서 옮김).
// 항목마다 원본 확대·후보 그림, 선택지, 후보를 고르면 바꿀 칸(edits)을 담는다. 요청과 화면은 jev-app.js가 맡는다.

const jevPicture = raster => ({ w: raster.grid.w, h: raster.grid.h, bytes: raster.straightBytes() });
/** 화면으로 보낼 그림 한 장. nearest: 도트 그대로 확대, gray: 깔 배경 밝기(0~1) */
const jevImage = (raster, nearest, gray = 0.88) => ({ picture: jevPicture(raster), nearest, gray });
const editList = map => [...map].map(([i, p]) => [i, p]);

function jevCropRect(reduced, centerX, centerY, span) {
  const box = reduced.contentRect;
  const w = Math.min(span, box.w), h = Math.min(span, box.h);
  return {
    x: Math.min(Math.max(box.x, centerX - Math.trunc(w / 2)), box.x + box.w - w),
    y: Math.min(Math.max(box.y, centerY - Math.trunc(h / 2)), box.y + box.h - h),
    w, h,
  };
}
const inside = (rect, i, w) => { const x = i % w, y = (i / w) | 0; return x >= rect.x && x < rect.x + rect.w && y >= rect.y && y < rect.y + rect.h; };
const cropTo = (raster, rect) => raster.crop(rect.x, rect.y, rect.w, rect.h);

function referenceCrop(subject, reduced, rect) {
  const box = reduced.contentRect;
  const sx = subject.grid.w / box.w, sy = subject.grid.h / box.h;
  const x = Math.floor((rect.x - box.x) * sx), y = Math.floor((rect.y - box.y) * sy);
  const right = Math.min(subject.grid.w, Math.ceil((rect.x + rect.w - box.x) * sx));
  const bottom = Math.min(subject.grid.h, Math.ceil((rect.y + rect.h - box.y) * sy));
  return subject.crop(x, y, right - x, bottom - y);
}

/** 가장자리 칸은 모양을 빙 둘러서 평균 위치가 몸 안쪽에 잡히기 쉽다. 대상 칸이 가장 많이 들어오는 칸을 가운데로. */
function jevFocus(points, reduced, w, span) {
  const rect = i => jevCropRect(reduced, i % w, (i / w) | 0, span);
  const count = r => points.filter(i => inside(r, i, w)).length;
  const stride = Math.max(1, Math.trunc(points.length / 200));
  let best = points[0], bestCount = -1;
  for (let k = 0; k < points.length; k += stride) {
    const c = count(rect(points[k]));
    if (c > bestCount) { best = points[k]; bestCount = c; }
  }
  return { rect: rect(best), x: best % w, y: (best / w) | 0 };
}

const firstMaxBy = (items, size) => items.reduce((best, item) => (best === undefined || size(item) > size(best) ? item : best), undefined);

function lineProbes(subject, reduced, current) {
  const grid = current.grid, cells = reduced.cells, w = grid.w;
  const depth = grid.depths(cells.map(c => c.cover >= 116));
  const ink = Array.from(depth, (d, i) => d > 0 && cells[i].dark >= 48);
  const center = Uint8Array.from(ink, Boolean);
  LineCleanup.skeletonize(center, grid);
  const wider = center.slice();
  for (let i = 0; i < center.length; i++) {
    if (!center[i]) continue;
    let best = -1;
    grid.each4(i, j => { if (ink[j] && !center[j] && cells[j].dark > (best < 0 ? -1 : cells[best].dark)) best = j; });
    if (best >= 0) wider[best] = 1;
  }
  const thin = new Map(), thick = new Map(), changes = [];
  for (let i = 0; i < ink.length; i++) {
    if (!(ink[i] && wider[i] && !center[i])) continue;
    const pixel = current.px[i];
    let fill = cells[i].fill;
    if (light(fill) < 112) {
      let neighbor = -1;
      grid.each8(i, j => {
        const cell = cells[j];
        const closest = neighbor < 0 ? Infinity : distance(cells[neighbor].fill, pixel);
        if (depth[j] > 0 && cell.dark < 30 && light(cell.fill) >= 112 && distance(cell.fill, pixel) < closest) neighbor = j;
      });
      if (neighbor < 0) continue;
      fill = cells[neighbor].fill;
    }
    thin.set(i, withAlpha(fill, A(pixel)));
    thick.set(i, withAlpha(cells[i].ink, A(pixel)));
    changes.push(i);
  }
  const box = reduced.contentRect;
  const span = Math.max(8, Math.min(28, Math.min(box.w, box.h)));
  const probes = [];
  for (const [id, title, points] of [['outer', '바깥 윤곽', changes.filter(i => depth[i] <= 2)], ['inner', '안쪽 선', changes.filter(i => depth[i] > 2)]]) {
    if (points.length === 0) continue;
    // 같은 종류 선의 바뀌는 칸이 가장 많이 모인 구역을 보여 준다.
    const tiles = new Map();
    for (const i of points) {
      const key = Math.trunc(i / w / span) * w + Math.trunc((i % w) / span);
      if (!tiles.has(key)) tiles.set(key, []);
      tiles.get(key).push(i);
    }
    const group = firstMaxBy([...tiles.keys()].sort((a, b) => a - b).map(k => tiles.get(k)), g => g.length);
    if (!group || group.length < 2) continue;
    const cx = Math.trunc(group.reduce((s, i) => s + (i % w), 0) / group.length);
    const cy = Math.trunc(group.reduce((s, i) => s + ((i / w) | 0), 0) / group.length);
    const rect = jevCropRect(reduced, cx, cy, span);
    const a = current.clone(), b = current.clone();
    for (const i of points) if (inside(rect, i, w)) { a.px[i] = thin.get(i); b.px[i] = thick.get(i); }
    probes.push({
      id, title: `${title} · 좌표 ${cx}, ${cy}`,
      instructions: `For group ${id}, compare its reference crop with A and B. Focus on ${id === 'outer' ? 'the outside contour' : 'the internal stroke'} where the options differ. Which stroke width looks more natural and faithful at sprite size? Ignore differences elsewhere. If both look similar or the reference is ambiguous, choose unclear.`,
      images: [jevImage(referenceCrop(subject, reduced, rect), false), jevImage(cropTo(a, rect), true), jevImage(cropTo(b, rect), true)],
      labels: ['원본 확대', '1픽셀 후보', '2픽셀 후보'],
      choices: [['Candidate A, thinner one-pixel stroke', '1픽셀'], ['Candidate B, thicker two-pixel stroke', '2픽셀'], ['Unclear or no material difference', '판단 유보']],
      edits: { 0: points.map(i => [i, thin.get(i)]), 1: points.map(i => [i, thick.get(i)]) },
      applyName: title,
    });
  }
  return probes;
}

function hairProbe(subject, reduced, current) {
  const grid = current.grid, cells = reduced.cells, w = grid.w, box = reduced.contentRect;
  const candidates = cells.map((c, i) => c.cover >= 150 && ((i / w) | 0) < box.y + box.h * 0.65 && chroma(c.fill) >= 28 && light(c.fill) >= 115);
  const area = firstMaxBy(grid.components(candidates), c => c.length);
  if (!area || area.length < 8) return null;
  const groups = new Map();
  for (const i of area) {
    const p = cells[i].fill, key = (Math.trunc(R(p) / 24) << 8) | (Math.trunc(G(p) / 24) << 4) | Math.trunc(B(p) / 24);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  const members = firstMaxBy([...groups.keys()].sort((a, b) => a - b).map(k => groups.get(k)), g => g.length);
  const tone = cells[members[0]].fill;
  const adjusted = current.clone();
  for (const i of area) {
    if (cells[i].dark >= 18) continue;
    const pixel = current.px[i];
    if (distance(pixel, tone) >= 7500) continue;
    adjusted.px[i] = withAlpha(mixed(pixel, tone, 32), A(pixel));
  }
  const cx = Math.trunc(members.reduce((s, i) => s + (i % w), 0) / members.length);
  const cy = Math.trunc(members.reduce((s, i) => s + ((i / w) | 0), 0) / members.length);
  const rect = jevCropRect(reduced, cx, cy, 44);
  const a = cropTo(current, rect), b = cropTo(adjusted, rect);
  if (a.px.every((p, k) => p === b.px[k])) return null;
  return {
    id: 'hair', title: `머리색 후보 · 좌표 ${cx}, ${cy}`,
    instructions: 'For hair, inspect the reference crop and compare A and B where they differ. If the differing region is visibly hair, choose the candidate whose hue and highlight-to-shadow range matches the hair best. If it is not hair, or the difference is too small, choose unclear. Ignore line weight.',
    images: [jevImage(referenceCrop(subject, reduced, rect), false), jevImage(a, true), jevImage(b, true)],
    labels: ['원본 확대', '현재 머리색', '대표색에 가까운 후보'],
    choices: [['Candidate A, current color', '현재 색'], ['Candidate B, color closer to the sampled tone', '대표색 후보'], ['Unclear, no material difference, or the region is not hair', '판단 유보']],
    edits: { 1: area.filter(i => adjusted.px[i] !== current.px[i]).map(i => [i, adjusted.px[i]]) },
    applyName: '머리색',
  };
}

/** 같은 밝은·어두운 배경에 올렸을 때 기준 그림(원본을 그대로 평균 낸 축소)보다 확 밝아지거나 어두워진 바깥 칸 */
function edgeFindings(reduced, current) {
  const reference = reduced.image;
  const shown = (p, background) => Math.trunc((light(p) * A(p) + background * (255 - A(p))) / 255);
  const pale = [], dark = [];
  for (let i = 0; i < current.px.length; i++) {
    const now = current.px[i], was = reference.px[i];
    if (A(now) === 0 || A(was) >= 128) continue;
    if (shown(now, 36) - shown(was, 36) >= 60) pale.push(i);
    else if (shown(was, 245) - shown(now, 245) >= 60) dark.push(i);
  }
  return [{ id: 'edge_light', title: '투명 테두리 · 밝은 띠', points: pale, gray: 0.14 },
    { id: 'edge_dark', title: '투명 테두리 · 어두운 띠', points: dark, gray: 0.96 }];
}

function edgeProbe(finding, subject, reduced, current) {
  const w = current.grid.w;
  const { rect, x, y } = jevFocus(finding.points, reduced, w, 20);
  const marked = current.clone();
  for (const i of finding.points) if (inside(rect, i, w)) marked.px[i] = pack(255, 0, 255);
  const kind = finding.id === 'edge_light' ? 'pale, white or light' : 'dark or shadow-like';
  return {
    id: finding.id, title: `${finding.title} · 좌표 ${x}, ${y}`,
    instructions: `For group ${finding.id}, all three images show the same crop on the same solid background. The sprite crop is a small pixel-art version of the reference crop. In the marked crop, magenta pixels are where a measurement found a ${kind} fringe outside the silhouette. Looking at the unmarked sprite crop, is that fringe a visible halo or band that the reference does not have, or does the edge look natural?`,
    images: [jevImage(referenceCrop(subject, reduced, rect), false, finding.gray), jevImage(cropTo(current, rect), true, finding.gray), jevImage(cropTo(marked, rect), true, finding.gray)],
    labels: ['같은 배경의 원본', '현재 결과', '측정된 칸(분홍)'],
    imageNames: ['reference crop', 'sprite crop', 'marked crop'],
    choices: [['A visible fringe or halo the reference does not have', '띠가 보임'], ['The edge looks natural and consistent with the reference', '자연스러움'], ['Unclear at this scale', '판단 유보']],
    note: `측정 ${finding.points.length}칸`,
    edits: { 0: finding.points.map(i => [i, reduced.image.px[i]]) },
    applyName: finding.title, optionNames: { 0: '띠 지우기' },
  };
}

function outlineProbe(subject, reduced, current) {
  const w = current.grid.w, base = reduced.image, crisp = crispOutline(base);
  const changed = [];
  for (let i = 0; i < base.px.length; i++) if (base.px[i] !== crisp.px[i]) changed.push(i);
  if (changed.length < 3) return null;
  const soft = current.clone(), sharp = current.clone();
  for (const i of changed) { soft.px[i] = base.px[i]; sharp.px[i] = crisp.px[i]; }
  const { rect, x, y } = jevFocus(changed, reduced, w, 24);
  return {
    id: 'outline', title: `바깥 외곽선 · 좌표 ${x}, ${y}`,
    instructions: 'For group outline, compare the outer silhouette of A and B with the reference crop. A keeps the soft, semi-transparent or colored outer edge. B redraws the outermost edge as a crisp one-pixel black outline and removes faint pixels outside it. For a clean game sprite, which outer edge is better while staying true to the reference? If the reference clearly uses a light or colored outer outline rather than a dark one, prefer A. If both look equally good, choose unclear.',
    images: [jevImage(referenceCrop(subject, reduced, rect), false), jevImage(cropTo(soft, rect), true), jevImage(cropTo(sharp, rect), true)],
    labels: ['원본 확대', '원래 가장자리', '검은 1픽셀'],
    choices: [['Candidate A, the original soft or colored outer edge', '원래 가장자리'], ['Candidate B, a crisp one-pixel black outer outline', '검은 1픽셀'], ['Unclear or no material difference', '판단 유보']],
    edits: { 0: changed.map(i => [i, base.px[i]]), 1: changed.map(i => [i, crisp.px[i]]) },
    applyName: '바깥 외곽선',
  };
}

/** 섞인 칸이 몰린 부분 최대 4곳. 부분마다 그대로·가까운 색·선 색 쪽 중에서 고르게 한다. */
function blendProbes(subject, reduced, current) {
  const w = current.grid.w, base = reduced.image, all = blendCandidates(base), left = new Map(all), probes = [];
  while (probes.length < 4 && left.size >= 6) {
    const { rect, x, y } = jevFocus([...left.keys()], reduced, w, 16);
    const cells = [...left.keys()].filter(i => inside(rect, i, w));
    if (cells.length < 6) break;
    for (const i of cells) left.delete(i);
    const keep = current.clone(), near = current.clone(), dark = current.clone();
    for (const i of cells) { const pick = all.get(i); keep.px[i] = base.px[i]; near.px[i] = pick.near; dark.px[i] = pick.dark; }
    const n = probes.length + 1, id = `blend${n}`;
    probes.push({
      id, title: `섞인 색 ${n} · 좌표 ${x}, ${y} · ${cells.length}칸`,
      instructions: `For group ${id}, compare the reference crop with three sprite crops. Cells on color borders were averaged during downscaling into muddy in-between colors that the reference does not contain (e.g. maroon between red and black). Treat such muddy colors as defects. A keeps them. B snaps each blended cell to the nearer of the two colors it sits between. C snaps each blended cell to the darker color, making line work bolder. Which gives clean flat colors and line work that best follow the shapes in the reference? If B and C look equally good, choose unclear.`,
      images: [jevImage(referenceCrop(subject, reduced, rect), false), jevImage(cropTo(keep, rect), true), jevImage(cropTo(near, rect), true), jevImage(cropTo(dark, rect), true)],
      labels: ['원본 확대', '그대로', '가까운 색', '선 색 쪽'],
      imageNames: ['reference crop', 'candidate A', 'candidate B', 'candidate C'],
      choices: [['Candidate A, keep the blended colors', '그대로'], ['Candidate B, snap to the nearer color', '가까운 색'], ['Candidate C, snap to the darker line color', '선 색 쪽'], ['Unclear or no material difference', '판단 유보']],
      edits: { 0: cells.map(i => [i, base.px[i]]), 1: cells.map(i => [i, all.get(i).near]), 2: cells.map(i => [i, all.get(i).dark]) },
      applyName: `섞인 색 ${n}`,
    });
  }
  return probes;
}

/** 부위별 진단(details) 또는 섞인 색 판정(blends)에 쓸 항목 */
function jevProbes(subject, reduced, current, focus) {
  let probes = [], edges = [];
  if (focus === 'blends') {
    probes = blendProbes(subject, reduced, current);
  } else {
    probes = lineProbes(subject, reduced, current);
    const hair = hairProbe(subject, reduced, current);
    if (hair) probes.push(hair);
    edges = edgeFindings(reduced, current);
    for (const finding of edges) if (finding.points.length >= 3) probes.push(edgeProbe(finding, subject, reduced, current));
    const outline = outlineProbe(subject, reduced, current);
    if (outline) probes.push(outline);
    const choices = [['Clearly visible in the reference and absent or substantially weaker in the sprite', '누락 의심'], ['Retained, or not present in the reference', '뚜렷한 누락 없음'], ['Unclear at the given scale', '판단 유보']];
    for (const [id, title, feature] of [
      ['face', '눈·입·표정', 'eyes, eye highlights, mouth, or distinctive expression marks'],
      ['strokes', '머리카락·옷 안쪽 선', 'distinctive internal hair strands, folds or decorative strokes'],
      ['accessory', '장식·떨어진 소품', 'accessories, ribbons, symbols, and detached props'],
      ['shading', '작은 색·명암', 'small colored details, intentional highlights, and distinctive shading patches'],
    ]) {
      probes.push({ id, title, choices, images: [], labels: [], edits: {}, full: true,
        instructions: `Compare FULL reference with FULL sprite. Are any ${feature} clearly present in the reference but absent or substantially weaker in the sprite? Ignore expected differences in edge antialiasing.` });
    }
  }
  const cleanEdges = edges.filter(f => f.points.length < 3).map(f => ({ id: f.id, title: f.title, result: `뚜렷한 이상 없음 · 측정 ${f.points.length}칸` }));
  return { focus, probes, cleanEdges, full: [jevImage(subject, false), jevImage(current, true)], base: jevPicture(current) };
}

// 작업자(Web Worker): 변환과 AI를 화면과 따로 돌려 처리 중에도 창이 멈추지 않게 한다.
// 일은 들어온 순서대로 하나씩 한다. 원본·캐릭터·선 지도는 여기 두고, 화면에는 결과 그림만 보낸다.
let current = null; // { original, masked, subject, reduced, lines, faithful }

const picture = raster => ({ w: raster.grid.w, h: raster.grid.h, bytes: raster.straightBytes() });

/** 원본 보존은 투명 그림의 떨어진 장식까지 살리고 원본에서 바로 격자를 읽어, 캐릭터·축소를 따로 둔다. */
function faithfulParts() {
  const { w, h } = current.reduced.image.grid;
  if (!current.faithful || current.faithful.w !== w || current.faithful.h !== h) {
    const subject = Subject.extract(current.original, current.masked, true);
    current.faithful = { w, h, subject, reduced: reduceDirect(subject, w, h) };
  }
  return current.faithful;
}

function finish(id, settings) {
  const parts = settings.method === 'faithful' ? faithfulParts() : current;
  const dotted = render(parts.subject, parts.reduced, settings, current.lines);
  const reduced = picture(parts.reduced.image), dot = picture(dotted.image);
  self.postMessage({ id, type: 'done', reduced, dotted: dot, status: dotStatus(settings, dotted) },
    [reduced.bytes.buffer, dot.bytes.buffer]);
}

async function handle(job) {
  const progress = label => self.postMessage({ id: job.id, type: 'progress', label });
  try {
    if (job.type === 'open') {
      const { original, w, h, settings } = job;
      const prepared = await prepareAny(original, w, h, progress);
      const lines = wantsLines(settings) ? await extractLines(prepared.subject, progress) : null;
      current = { original, masked: prepared.masked, subject: prepared.subject, reduced: prepared.reduced, lines, faithful: null };
      finish(job.id, settings);
    } else if (job.type === 'resize') {
      current = { ...current, reduced: reduce(current.subject, job.w, job.h) };
      finish(job.id, job.settings);
    } else if (job.type === 'redot') {
      if (wantsLines(job.settings) && !current.lines) current.lines = await extractLines(current.subject, progress);
      finish(job.id, job.settings);
    } else if (job.type === 'jev') {
      // JEV에 물을 항목(확대 그림·후보·바꿀 칸). 요청은 화면이 프로그램 본체를 거쳐 보낸다.
      const { subject, reduced } = faithfulParts();
      const now = Raster.fromStraight(job.current.bytes, job.current.w, job.current.h);
      self.postMessage({ id: job.id, type: 'done', ...jevProbes(subject, reduced, now, job.focus) });
    } else if (job.type === 'subject') {
      // 클라우드 AI에 보낼 캐릭터 그림
      const subject = picture(current.subject);
      self.postMessage({ id: job.id, type: 'done', subject }, [subject.bytes.buffer]);
    } else if (job.type === 'cloud') {
      // 클라우드 AI 그림 마무리. 도트 그림(PixelLab)은 배경만 지우고, 아니면 지금 설정으로 도트화한다.
      const { image, w, h, settings, pixel } = job;
      let result, status;
      if (pixel) {
        const raster = Raster.from(image);
        removePaleBackdrop(raster);
        result = raster;
        status = `AI 도트 그림 · 배경 지움 · ${raster.grid.w}×${raster.grid.h}`;

// ───────────────────────────── 2.0 방식: 축소(Reduced)
class Acc {

      if (!(cover > 0)) continue;
      const dark = Math.floor(ink.weight * 100 / average.weight);
      const accentShare = Math.floor(accent.weight * 100 / average.weight);
      const mean = average.color, fillColor = fill.weight === 0 ? mean : fill.color;
      const i = (v + y) * w + u + x;
      cells[i] = { fill: fillColor, ink: ink.color, cover, dark, accent: accentShare, accentColor: accent.color };
      const p = dark >= 25 && dark < 75 && cover >= 150 ? mixed(mean, ink.color, Math.trunc((dark - 20) / 2)) : mean;
      output.px[i] = withAlpha(p, cover);
    }
  }
  return { image: output, cells };
}

// ───────────────────────────── 2.0 방식: 도트화
// method: 'berry' 베리 잉크 · 'basic' 2.0 방식 · 'soft' 원본 색 살림(개선판 '약하게', 색 수는 softColors)
// softLines: 원본 색 살림에서 선을 1픽셀로 정리(원본에서 선 줄기 찾기) · softVivid: 원본 색 살림에서 채도 25% 올리기
// softClean: 원본 색 살림에서 바깥 테두리를 순검정 1px로 잇고 색 면 정리(비슷한 색 합치기·혼자 떨어진 점 지우기)
const defaultSettings = () => ({ width: 1, boundary: true, transparency: 80, colors: 12, cleanup: 1, method: 'faithful', aiLines: false, softColors: 24, softLines: true, softVivid: true, softClean: true, crispOutline: false, cleanBlends: false });

class Palette {
  constructor(pixels) {
    const counts = [new Map(), new Map(), new Map(), new Map()];
    for (const p of pixels) {
      const key = Math.floor(R(p) / 22) * 144 + Math.floor(G(p) / 22) * 12 + Math.floor(B(p) / 22);
      const bins = counts[Palette.family(p)];
      if (!bins.has(key)) bins.set(key, new Acc());
      bins.get(key).add(p);
    }
    const limits = [4, 6, 5, 6];
    this.colors = counts.map((bins, family) => {
      const chosen = [];
      const ranked = [...bins].sort((a, b) => (a[1].weight === b[1].weight ? a[0] - b[0] : b[1].weight - a[1].weight));
      for (const [, bin] of ranked) {
        if (chosen.length >= limits[family]) continue;
        const color = bin.color;
        if (!chosen.some(c => distance(c, color) < 380)) chosen.push(color);
      }
      return chosen;
    });
  }
  nearest(p, preservingSmallColor = false) {
    const choices = this.colors[Palette.family(p)];
    const closest = firstMin(choices, (a, b) => distance(a, p) < distance(b, p));
    if (closest === undefined) return p;
    if (preservingSmallColor && distance(closest, p) > 2700) return p;
    return closest;
  }
  static family(p) {
    if (chroma(p) <= 24) return 0;
    if (pink(p)) return 1;
    if (B(p) > G(p) && B(p) >= R(p) - 12) return 2;
    return 3;
  }
}

function renderBasic(input, settings, lines = null) {
  const grid = input.image.grid, cells = input.cells;
  const mask = cells.map(c => c.cover >= 116);
  if (!mask.includes(true)) fail('subject');
  const W = settings.width;
  const depth = grid.depths(mask);
  const outline = Array.from(depth, d => d >= 1 && d <= W);
  const head = largest(grid.components(mask.map((m, i) => m && pink(cells[i].fill))));
  const headY = head.length === 0 ? 0 : Math.floor(head.reduce((s, i) => s + Math.floor(i / grid.w), 0) / head.length);
  const body = largest(grid.components(mask.map((m, i) => depth[i] > W && Math.floor(i / grid.w) > headY && paper(cells[i].fill)), false));
  const isBody = new Set(body);
  const boundary = new Array(grid.count).fill(false);
  const palettePixels = [];
  for (let i = 0; i < grid.count; i++) if (mask[i] && !outline[i] && cells[i].dark < 57) palettePixels.push(cells[i].fill);
  const palette = new Palette(palettePixels);

  const rim = outline.slice();
  for (let layer = W + 1; layer <= W + 2; layer++) {
    for (let i = 0; i < grid.count; i++) {
      if (!(depth[i] === layer && cells[i].dark >= 18)) continue;
      let attached = false;
      grid.each4(i, j => { if (depth[j] === layer - 1 && rim[j]) attached = true; });
      if (attached) rim[i] = true;
    }
  }

  let output = new Raster(grid.w, grid.h);
  for (let i = 0; i < grid.count; i++) {
    if (!mask[i]) continue;
    if (outline[i]) { output.px[i] = BLACK; continue; }
    const cell = cells[i];
    let color;
    let bodyEdge = isBody.has(i);
    if (cell.dark >= 48 && !rim[i]) {
      color = pack(Math.max(13, R(cell.ink)), Math.max(10, G(cell.ink)), Math.max(13, B(cell.ink)));
    } else {
      let fill = cell.fill;
      if (depth[i] <= W + 2) {
        const anchors = [];
        grid.each8(i, j => { if (depth[j] > depth[i] && cells[j].dark < 30) anchors.push(j); });
        const hairAnchors = anchors.filter(j => pink(cells[j].fill));
        const bodyAnchors = anchors.filter(j => isBody.has(j));
        let nearest;
        if (!pink(fill) && bodyAnchors.length > 0 && bodyAnchors.length > hairAnchors.length &&
            (paper(fill) || (rim[i] && chroma(fill) < 38))) {
          bodyEdge = true;
          fill = cells[bodyAnchors[0]].fill;
        } else if (rim[i] && !pink(fill) && hairAnchors.length * 2 > anchors.length &&
                   (chroma(fill) < 36 || light(fill) < 158)) {
          fill = cells[hairAnchors[0]].fill;
        } else if (rim[i] && (cell.dark > 45 || light(fill) < 158) &&
                   (nearest = firstMin(anchors, (a, b) => distance(cells[a].fill, fill) < distance(cells[b].fill, fill))) !== undefined) {
          fill = cells[nearest].fill;
        }
      }
      color = palette.nearest(fill);
    }
    boundary[i] = depth[i] === W + 1 && bodyEdge && paper(color);
    if (settings.boundary && boundary[i]) {
      const intermediate = mixed(color, BLACK, 50);
      output.px[i] = mixed(color, intermediate, 100 - settings.transparency);
    } else {
      output.px[i] = color;
    }
  }
  LineCleanup.apply(output, mask, outline, W);
  if (lines) LineGuide.apply(output, mask, outline, W, lines);
  FaceDetail.apply(output, mask);
  output = ColorReducer.apply(output, outline, boundary, settings);
  return { image: output, mask, outline, boundary, bodyCount: body.length, headCount: head.length };
}

// ───────────────────────────── 색 줄이기
const ColorReducer = {
  count(image) { const s = new Set(); for (const p of image.px) if (A(p) > 0) s.add(KEY(p)); return s.size; },

  apply(source, outline, boundary, settings) {
    const limit = Math.max(6, Math.min(32, settings.colors));
    const image = source.clone();
    const px = image.px;
    const visible = [];
    for (let i = 0; i < px.length; i++) if (A(px[i]) > 0) visible.push(i);
    if (visible.length === 0) return image;
    const histogram = new Map();
    for (const i of visible) if (!outline[i] && !boundary[i]) histogram.set(KEY(px[i]), (histogram.get(KEY(px[i])) ?? 0) + 1);
    const samples = [...histogram].sort((a, b) => a[0] - b[0]).map(([k, weight]) => ({ color: keyPixel(k), weight }));
    const paperColor = firstMax(samples.filter(s => paper(s.color)),
      (a, b) => (a.weight === b.weight ? light(a.color) < light(b.color) : a.weight < b.weight))?.color;
    const palette = [BLACK];
    if (paperColor !== undefined) palette.push(paperColor);
    const hasRim = settings.boundary && visible.some(i => boundary[i]);
    let rim;
    if (hasRim && paperColor !== undefined) {
      const middle = mixed(paperColor, BLACK, 50);
      rim = mixed(paperColor, middle, 100 - settings.transparency);
      if (!palette.includes(rim)) palette.push(rim);
    }
    const rimIndex = rim === undefined ? -1 : palette.indexOf(rim);
    const interiorPalette = palette.filter((c, index) => index !== rimIndex || c === paperColor || c === BLACK);
    const fixedCount = palette.length;
    for (let family = 1; family <= 3 && palette.length < limit; family++) {
      const sample = firstMax(samples.filter(s => category(s.color) === family), (a, b) => a.weight < b.weight);
      if (sample && !palette.includes(sample.color)) palette.push(sample.color);
    }
    while (palette.length < limit) {
      const imp = s => distance(s.color, palette[nearest(s.color, palette)]) * Math.sqrt(s.weight);
      const next = firstMax(samples, (a, b) => imp(a) < imp(b));
      if (!next || palette.includes(next.color)) break;
      palette.push(next.color);
    }
    const interiorIndices = palette.map((_, i) => i).filter(i => i !== rimIndex || palette[i] === paperColor || palette[i] === BLACK);
    for (let round = 0; round < 5; round++) {
      const allowed = interiorIndices.map(i => palette[i]);
      const groups = palette.map(() => []);
      samples.forEach((s, i) => groups[interiorIndices[nearest(s.color, allowed)]].push(i));
      let changed = false;
      for (let group = fixedCount; group < palette.length; group++) {
        if (groups[group].length === 0) continue;
        let r = 0, g = 0, b = 0, weight = 0;
        for (const i of groups[group]) {
          const it = samples[i];
          r += R(it.color) * it.weight; g += G(it.color) * it.weight; b += B(it.color) * it.weight; weight += it.weight;
        }
        const mean = pack(Math.floor(r / weight), Math.floor(g / weight), Math.floor(b / weight));
        const best = firstMin(groups[group], (x, y) => distance(samples[x].color, mean) < distance(samples[y].color, mean));
        const color = samples[best].color;
        changed = changed || color !== palette[group];
        palette[group] = color;
      }
      if (!changed) break;
    }
    const fillPalette = interiorPalette.concat(palette.slice(fixedCount));
    const mapping = new Map();
    for (const s of samples) {
      const c = s.color;
      if (paperColor !== undefined && light(c) >= 195 && chroma(c) <= 24) mapping.set(KEY(c), paperColor);
      else mapping.set(KEY(c), fillPalette[nearest(c, fillPalette)]);
    }
    for (const i of visible) {
      const old = px[i];
      let color;
      if (outline[i]) color = BLACK;
      else if (boundary[i] && rim !== undefined) color = rim;
      else color = mapping.get(KEY(old)) ?? fillPalette[nearest(old, fillPalette)];
      px[i] = withAlpha(color, A(old));
    }
    if (!(settings.cleanup > 0)) return image;
    const mapped = px.slice();
    const tolerance = settings.cleanup === 1 ? 1600 : 3600;
    for (const i of visible) {
      if (outline[i] || boundary[i] || !(light(mapped[i]) > 110)) continue;
      const neighbors = new Map();
      image.grid.each8(i, j => {
        const p = mapped[j];
        if (A(p) > 0 && !outline[j] && !boundary[j] && category(p) === category(mapped[i])) neighbors.set(KEY(p), (neighbors.get(KEY(p)) ?? 0) + 1);
      });
      const own = neighbors.get(KEY(mapped[i])) ?? 0;
      if (!(own <= settings.cleanup)) continue;
      const majority = [...neighbors].sort((a, b) => (a[1] === b[1] ? a[0] - b[0] : b[1] - a[1]))[0];
      if (!majority || majority[1] < 5) continue;
      const color = palette.find(c => KEY(c) === majority[0]);
      if (color === undefined || distance(color, mapped[i]) > tolerance) continue;
      px[i] = withAlpha(color, A(mapped[i]));
    }
    return image;
  },
};

function nearest(color, palette) {
  const family = category(color);
  const same = [];
  for (let i = 0; i < palette.length; i++) if (category(palette[i]) === family && light(palette[i]) > 105) same.push(i);
  let choices;
  if (light(color) > 110 && same.length > 0) {
    choices = same;
    for (let i = 0; i < palette.length; i++) if (palette[i] === BLACK) choices.push(i);
  } else choices = palette.map((_, i) => i);
  return firstMin(choices, (a, b) => distance(color, palette[a]) < distance(color, palette[b]));
}
function category(c) {
  if (chroma(c) <= 12 || paper(c)) return 0;
  if (pink(c)) return 1;
  if (B(c) > G(c) && B(c) >= R(c) - 12) return 2;
  return 3;
}

// ───────────────────────────── 선·얼룩 정리
function countVotes(map, key, p) { const v = map.get(key); if (v) v[0]++; else map.set(key, [1, p]); }

const LineCleanup = {
  isInk: p => A(p) > 0 && light(p) < 70 && chroma(p) < 60,

  apply(raster, mask, outline, width) {
    thinInk(raster, mask, outline, width);
    removeSpecks(raster, mask, outline);
  },

  /** 참·거짓 지도를 1픽셀 뼈대로 줄인다(Zhang-Suen). */
  skeletonize(on, grid) { zhangSuen(on, grid, null); },
};

function zhangSuen(on, grid, keep) {
  const w = grid.w, h = grid.h;
  const at = (x, y) => x >= 0 && y >= 0 && x < w && y < h && on[y * w + x];
  const removed = [];
  let changed = true;
  const n = new Array(8);
  while (changed) {
    changed = false;
    for (let pass = 0; pass < 2; pass++) {
      const drop = [];
      for (let i = 0; i < on.length; i++) {
        if (!on[i] || (keep && keep[i])) continue;
        const x = i % w, y = (i / w) | 0;
        n[0] = at(x, y - 1); n[1] = at(x + 1, y - 1); n[2] = at(x + 1, y); n[3] = at(x + 1, y + 1);
        n[4] = at(x, y + 1); n[5] = at(x - 1, y + 1); n[6] = at(x - 1, y); n[7] = at(x - 1, y - 1);
        let count = 0;
        for (let k = 0; k < 8; k++) if (n[k]) count++;
        if (count < 2 || count > 6) continue;
        let transitions = 0;
        for (let k = 0; k < 8; k++) if (!n[k] && n[(k + 1) % 8]) transitions++;
        if (transitions !== 1) continue;
        const ok = pass === 0 ? !(n[0] && n[2] && n[4]) && !(n[2] && n[4] && n[6])
          : !(n[0] && n[2] && n[6]) && !(n[0] && n[4] && n[6]);
        if (ok) drop.push(i);
      }
      for (const i of drop) on[i] = false;
      removed.push(...drop);
      if (drop.length) changed = true;
    }
  }
  return removed;
}

function thinInk(raster, mask, outline, width) {
  const grid = raster.grid, isInk = LineCleanup.isInk;
  const line = mask.map((m, i) => m && (outline[i] || isInk(raster.px[i])));
  const depth = grid.depths(mask);
  const keep = mask.map((_, i) => outline[i] || depth[i] > width + 2);
  const removed = zhangSuen(line, grid, keep);
  for (const i of removed) {
    const fill = commonNeighbor(raster, i, mask, j => line[j] || isInk(raster.px[j]));
    if (fill !== undefined) raster.px[i] = fill; else line[i] = true;
  }
}

function removeSpecks(raster, mask, outline) {
  const grid = raster.grid, before = raster.px.slice(), isInk = LineCleanup.isInk;
  for (let i = 0; i < grid.count; i++) {
    if (!mask[i] || outline[i] || isInk(before[i])) continue;
    let opaque = true, alone = true;
    grid.each8(i, j => { if (!mask[j]) opaque = false; if (before[j] === before[i]) alone = false; });
    if (!opaque || !alone || grid.edge(i)) continue;
    const counts = new Map();
    grid.each8(i, j => { const p = before[j]; if (!outline[j] && !isInk(p)) countVotes(counts, KEY(p), p); });
    const best = firstMax(counts.values(), (a, b) => a[0] < b[0]);
    if (!best || best[0] < 4 || !(distance(best[1], before[i]) < 3000)) continue;
    raster.px[i] = best[1];
  }
}

function commonNeighbor(raster, i, mask, skip) {
  const counts = new Map();
  raster.grid.each8(i, j => { if (mask[j] && !skip(j)) countVotes(counts, KEY(raster.px[j]), raster.px[j]); });
  return firstMax(counts.values(), (a, b) => a[0] < b[0])?.[1];
}

// ───────────────────────────── 선 추출 AI 선 지도 반영
const LineGuide = {
  /** lines: 캐릭터(subject)와 같은 크기의 선 지도(Raster). 어두울수록 선. */
  apply(raster, mask, outline, width, lines) {
    const grid = raster.grid, isInk = LineCleanup.isInk;
    const coverage = sampleLines(lines, mask, grid);
    if (!coverage) return 0;
    const depth = grid.depths(mask);
    const ink = new Map();
    for (let i = 0; i < grid.count; i++) if (mask[i] && !outline[i] && isInk(raster.px[i])) countVotes(ink, KEY(raster.px[i]), raster.px[i]);
    const lineColor = firstMax(ink.values(), (a, b) => a[0] < b[0])?.[1] ?? BLACK;
    const inner = mask.map((m, i) => m && !outline[i] && depth[i] > width + 2);
    const near = (i, test) => { let hit = test(i); grid.each8(i, j => { if (test(j)) hit = true; }); return hit; };
    const before = raster.px.slice();
    const skeleton = mask.map((_, i) => inner[i] && coverage[i] >= 0.35);
    LineCleanup.skeletonize(skeleton, grid);
    const hadInk = mask.map((m, i) => m && (outline[i] || isInk(raster.px[i])));
    const added = new Array(grid.count).fill(false);
    for (let i = 0; i < grid.count; i++) {
      if (skeleton[i] && !hadInk[i] && !near(i, j => hadInk[j] && j !== i)) { raster.px[i] = lineColor; added[i] = true; }
    }
    const seen = new Array(grid.count).fill(false);
    let total = 0;
    for (let start = 0; start < grid.count; start++) {
      if (!added[start] || seen[start]) continue;
      const piece = [start];
      let touches = false;
      seen[start] = true;
      for (let next = 0; next < piece.length; next++) {
        grid.each8(piece[next], j => { if (added[j] && !seen[j]) { seen[j] = true; piece.push(j); } else if (hadInk[j]) touches = true; });
      }
      if (!touches && piece.length < 3) for (const i of piece) { raster.px[i] = before[i]; added[i] = false; }
      else total += piece.length;
    }
    return total;
  },
};

function sampleLines(lines, mask, grid) {
  let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
  for (let i = 0; i < grid.count; i++) {
    if (!mask[i]) continue;
    const x = i % grid.w, y = (i / grid.w) | 0;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, factor = 4;
  const scaled = Raster.from(lines.image(), bw * factor, bh * factor);
  const coverage = new Float64Array(grid.count);
  for (let v = 0; v < bh; v++) for (let u = 0; u < bw; u++) {
    let dark = 0;
    for (let sy = 0; sy < factor; sy++) for (let sx = 0; sx < factor; sx++) if (light(scaled.px[(v * factor + sy) * scaled.grid.w + u * factor + sx]) < 128) dark++;
    coverage[(v + y0) * grid.w + u + x0] = dark / (factor * factor);
  }
  return coverage;
}

// ───────────────────────────── 볼터치 살리기
const FaceDetail = {
  apply(raster, mask) { deepenBlush(raster, mask, findEyes(raster, mask)); },
};
const isEye = p => A(p) > 0 && !LineCleanup.isInk(p) && chroma(p) > 24 && B(p) > G(p) && B(p) >= R(p) - 12;

function findEyes(raster, mask) {
  const grid = raster.grid, w = grid.w;
  const pieces = grid.components(mask.map((m, i) => m && isEye(raster.px[i]))).filter(p => p.length >= 12 && p.length <= 260);
  const center = piece => [piece.reduce((s, i) => s + i % w, 0) / piece.length, piece.reduce((s, i) => s + Math.floor(i / w), 0) / piece.length];
  let best = null;
  for (let a = 0; a < pieces.length; a++) {
    for (let b = a + 1; b < pieces.length; b++) {
      const p = pieces[a], q = pieces[b], cp = center(p), cq = center(q);
      const sizeGap = Math.abs(p.length - q.length) / Math.max(p.length, q.length);
      const apart = Math.abs(cp[0] - cq[0]) >= Math.max(8, Math.sqrt(Math.min(p.length, q.length)) * 1.5);
      if (!(sizeGap < 0.6 && Math.abs(cp[1] - cq[1]) < 9 && apart)) continue;
      const smaller = Math.min(p.length, q.length);
      if (smaller > (best?.[0] ?? 0)) best = [smaller, p, q];
    }
  }
  if (!best) return [];
  return [best[1], best[2]].map(eye => {
    const xs = eye.map(i => i % w), ys = eye.map(i => Math.floor(i / w));
    return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
  });
}

function deepenBlush(raster, mask, eyes) {
  if (eyes.length === 0) return;
  const grid = raster.grid, w = grid.w;
  const region = new Uint8Array(grid.count);
  for (const eye of eyes) {
    const ew = eye.maxX - eye.minX + 1, eh = eye.maxY - eye.minY + 1;
    const ya = Math.max(0, eye.maxY - Math.trunc(eh / 3)), yb = Math.min(grid.h - 1, eye.maxY + eh + Math.trunc(eh / 2));
    const xa = Math.max(0, eye.minX - Math.trunc(ew / 2)), xb = Math.min(w - 1, eye.maxX + Math.trunc(ew / 2));
    for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) region[y * w + x] = 1;
  }
  const pinkish = p => A(p) > 0 && light(p) >= 185 && chroma(p) >= 12 && chroma(p) <= 70 && R(p) > G(p) && R(p) >= B(p) && !paper(p);
  const counts = new Map();
  for (let i = 0; i < grid.count; i++) if (region[i] && mask[i] && pinkish(raster.px[i])) countVotes(counts, KEY(raster.px[i]), raster.px[i]);
  const best = firstMax(counts.values(), (a, b) => a[0] < b[0]);
  if (!best || best[0] < 4) return;
  const blush = best[1], deeper = saturated(blush, 1.9);
  for (let i = 0; i < grid.count; i++) if (raster.px[i] === blush) raster.px[i] = deeper;
}

function saturated(p, factor) {
  const maxC = Math.max(R(p), G(p), B(p)), minC = Math.min(R(p), G(p), B(p));
  if (!(maxC > 0)) return p;
  const s = Math.min(0.45, (maxC - minC) / maxC * factor);
  const channel = c => {
    const t = maxC === minC ? 0 : (maxC - c) / (maxC - minC);

  const strength = Math.min(1, F(F(variation - F(0.005)) / F(0.024)));
  return { color: vadd(mean, vmul(vsub(best, mean), strength)), detail: strength };
}

function buildPalette(pixels, count) {
  const bins = new Map();

    if (!(pixel.alpha > F(0.02))) continue;

    let bin = bins.get(key);
    if (!bin) bins.set(key, bin = { total: ZERO(), weight: 0 });
    bin.total = vadd(bin.total, vmul(pixel.color, weight));
    bin.weight = F(bin.weight + weight);
  }
  const swatches = [...bins.keys()].sort((x, y) => x - y).map(k => {
    const bin = bins.get(k);
    return { color: vdiv(bin.total, bin.weight), weight: F(Math.pow(bin.weight, F(0.65))) };
  });

    const last = palette[palette.length - 1];
    let bestIndex = 0, bestScore = -1;
    for (let index = 0; index < swatches.length; index++) {

      const score = F(distances[index] * swatches[index].weight);
      if (score > bestScore) { bestIndex = index; bestScore = score; }
    }
    if (!(bestScore > 0)) break;
    palette.push(swatches[bestIndex].color);
  }
  for (let round = 0; round < 7; round++) {
    const clusters = palette.map(() => ({ total: ZERO(), weight: 0 }));
    for (const swatch of swatches) {
      const c = clusters[nearestLab(swatch.color, palette)];
      c.total = vadd(c.total, vmul(swatch.color, swatch.weight));
      c.weight = F(c.weight + swatch.weight);
    }
    clusters.forEach((c, index) => { if (c.weight > 0) palette[index] = vdiv(c.total, c.weight); });

}

function nearestLab(color, palette) {
  let winner = 0, closest = Infinity;
  for (let index = 0; index < palette.length; index++) {

}

function spritePixels(bytes, stride, width, height, colors) {
  const side = 4, sampleCount = F(side * side);

  let ink0 = 0, ink1 = 0, ink2 = 0, inkWeight = 0, white0 = 0, white1 = 0, white2 = 0, whiteWeight = 0;
  const fillSamples = Array.from({ length: side * side }, () => ({ color: ZERO(), weight: 0 }));
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let alphaSum = 0, stroke = 0, centerInk = 0, lightGap = 0, fillWeight = 0;
      let f0 = 0, f1 = 0, f2 = 0, a0 = 0, a1 = 0, a2 = 0, w0 = 0, w1 = 0, w2 = 0, whiteCoverage = 0;
      let c0 = 0, c1 = 0, c2 = 0, chromaticCoverage = 0, chromaticWeight = 0;
      for (let sy = 0; sy < side; sy++) {
        for (let sx = 0; sx < side; sx++) {
          const offset = (y * side + sy) * stride + (x * side + sx) * 4;
          const alpha = bytes[offset + 3];
          const index = sy * side + sx;
          fillSamples[index].weight = 0;
          if (alpha === 0) continue;
          const coverage = F(alpha / 255);
          const color = decodeLab(bytes[offset], bytes[offset + 1], bytes[offset + 2], alpha);
          const ch = F(Math.abs(color[1]) + Math.abs(color[2]));
          const dark = F(Math.min(1, Math.max(0, F(F(K_DARK - color[0]) / K_DARKS))) * Math.max(K035, F(1 - F(4 * ch))));
          const weight = F(F(coverage * F(1 - dark)) * F(1 - dark));
          if (weight > K009) fillSamples[index] = { color, weight };
          alphaSum = F(alphaSum + coverage);
          stroke = F(stroke + F(coverage * dark));
          const strength = len2(color[1], color[2]);
          const L = color[0], P = color[1], Q = color[2];
          if (L >= K046 && strength >= K0034) {
            c0 = F(c0 + F(L * coverage)); c1 = F(c1 + F(P * coverage)); c2 = F(c2 + F(Q * coverage));
            chromaticCoverage = F(chromaticCoverage + coverage);
            chromaticWeight = F(chromaticWeight + F(strength * coverage));
          }
          if (sx >= 1 && sx <= 2 && sy >= 1 && sy <= 2) {
            centerInk = F(centerInk + F(coverage * dark));
            if (color[0] > K092 && ch < K0045) lightGap = F(lightGap + coverage);
          }
          f0 = F(f0 + F(L * weight)); f1 = F(f1 + F(P * weight)); f2 = F(f2 + F(Q * weight));
          fillWeight = F(fillWeight + weight);
          a0 = F(a0 + F(L * coverage)); a1 = F(a1 + F(P * coverage)); a2 = F(a2 + F(Q * coverage));
          if (dark >= K072) {
            ink0 = F(ink0 + F(F(L * dark) * coverage)); ink1 = F(ink1 + F(F(P * dark) * coverage)); ink2 = F(ink2 + F(F(Q * dark) * coverage));
            inkWeight = F(inkWeight + F(dark * coverage));

          if (L > K0965 && ch < K0022) {

      }
      if (!(alphaSum >= F(sampleCount * K046))) continue;

      if (whiteCoverage >= Math.max(1, F(fillWeight * K056))) {

  for (let i = 0; i < n; i++) if (pixels[i].alpha > 0) opaque.push(i);

  const neighbors = (i, diagonals = false) => {
    const x = i % width, y = (i / width) | 0, out = [];
    for (let v = Math.max(0, y - 1); v <= Math.min(height - 1, y + 1); v++) for (let u = Math.max(0, x - 1); u <= Math.min(width - 1, x + 1); u++) {
      if ((u !== x || v !== y) && (diagonals || u === x || v === y)) out.push(v * width + u);
    }
    return out;
  };
  const strokes = new Array(n).fill(false);
  if (inkWeight > 0) {
    for (const i of opaque) {
      const edge = neighbors(i).some(j => pixels[j].alpha === 0);
      const coverage = pixels[i].detail;
      if (!edge) {
        const protectedGap = lightGaps[i] >= K072 && centers[i] < F(0.20);
        const concentrated = centers[i] >= K058 && coverage >= F(0.25);
        strokes[i] = coverage >= F(0.57) || (!protectedGap && (coverage >= K035 || concentrated));
      } else {
        strokes[i] = coverage >= (edge ? F(0.17) : K035);
      }
    }
    const core = strokes.slice();
    for (const i of opaque) {
      if (core[i] || !(pixels[i].detail >= F(0.23))) continue;
      if (lightGaps[i] >= K072 && centers[i] < F(0.20)) continue;
      const adjoining = neighbors(i, true).filter(j => core[j]);
      const x = i % width, y = (i / width) | 0;
      strokes[i] = adjoining.some(a => adjoining.some(b => (a % width - x) * (b % width - x) + (((a / width) | 0) - y) * (((b / width) | 0) - y) < 0));
    }
  }
  const isWhiteLab = c => c[0] > K0965 && F(Math.abs(c[1]) + Math.abs(c[2])) < K0022;
  if (width > 1 && height > 1) {
    for (let y = 0; y < height - 1; y++) {
      for (let x = 0; x < width - 1; x++) {
        const first = y * width + x;
        const block = [first, first + 1, first + width, first + width + 1];
        if (!block.every(j => strokes[j])) continue;
        const i = firstMin(block, (a, b) => pixels[a].detail < pixels[b].detail);
        if (!(pixels[i].detail < F(0.62))) continue;
        const around = neighbors(i, true);
        const adjacentFill = around.filter(j => !strokes[j]);
        if (!(adjacentFill.length >= 2 && adjacentFill.every(j => {
          const p = pixels[j];
          return p.alpha > 0 && p.color[0] > F(0.85) && F(Math.abs(p.color[1]) + Math.abs(p.color[2])) < F(0.10);
        }))) continue;
        const whiteCount = adjacentFill.filter(j => isWhiteLab(pixels[j].color)).length;
        if (!(whiteCount * 2 < adjacentFill.length)) continue;

        const reached = new Set(connected.slice(0, 1));
        for (let k = 0; k < connected.length; k++) {
          const previous = new Set(reached);

  if (hasInk) palette.push(vdiv([ink0, ink1, ink2], inkWeight));

  if (hasWhite) palette.push(vdiv([white0, white1, white2], whiteWeight));

  for (const i of opaque) labels[i] = strokes[i] ? 0 : nearestLab(pixels[i].color, fillPalette) + fillOffset;

    for (let k = 1; k < votes.length; k++) if (votes[best] < votes[k]) best = k;

function keepFillHues(labels, palette, evidence, width, height, fillOffset) {
  const strengths = palette.map(c => len2(c[1], c[2]));
  const initial = labels.slice();
  const K077 = F(0.77), K026 = F(0.026), K016 = F(0.16);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = y * width + x, source = evidence[i], label = initial[i];
      if (!(label >= fillOffset && source[0] > 0)) continue;
      const strength = len2(source[1], source[2]);
      const matches = c => strengths[c] >= K026 &&
        F(F(source[1] * palette[c][1]) + F(source[2] * palette[c][2])) >= F(F(K077 * strength) * strengths[c]);
      if (matches(label)) continue;
      let best = label, bestDistance = Infinity, supporting = 0;
      for (let v = Math.max(0, y - 1); v <= Math.min(height - 1, y + 1); v++) {
        for (let u = Math.max(0, x - 1); u <= Math.min(width - 1, x + 1); u++) {
          const candidate = initial[v * width + u];
          if (!(candidate >= fillOffset && matches(candidate) && Math.abs(F(source[0] - palette[candidate][0])) < K016)) continue;
          supporting++;
          const d = dist2(source, palette[candidate]);
          if (d < bestDistance) { bestDistance = d; best = candidate; }
        }
      }
      if (supporting >= 2) labels[i] = best;
    }
  }
}

function thinSpriteInk(strokes, pixels, width, height, isWhiteLab) {
  if (!(width > 2 && height > 2)) return;
  const ring = [-width, 1 - width, 1, 1 + width, width, width - 1, -1, -1 - width];
  const candidates = [];
  for (let i = 0; i < strokes.length; i++) {
    const x = i % width, y = (i / width) | 0;
    if (x > 0 && x + 1 < width && y > 0 && y + 1 < height && strokes[i] && pixels[i].detail < F(0.82)) candidates.push(i);
  }
  candidates.sort((a, b) => pixels[a].detail - pixels[b].detail);

  for (let pass = 0; pass < 2; pass++) {
    for (const i of candidates) {
      if (!strokes[i]) continue;
      const nb = ring.map(o => i + o);
      const sides = [nb[0], nb[2], nb[4], nb[6]];
      if (!sides.every(j => pixels[j].alpha > 0)) continue;
      if (sides.filter(j => strokes[j]).length > 2) continue;
      const fill = sides.filter(j => !originalStrokes[j]);
      if (fill.length === 0) continue;
      const r = nb.map(j => strokes[j]);
      if (r.filter(Boolean).length < 3) continue;
      let entries = 0;
      for (let k = 0; k < 8; k++) if (!r[k] && r[(k + 1) % 8]) entries++;
      if (entries !== 1) continue;
      const color = pixels[i].color;
      const white = fill.filter(j => isWhiteLab(pixels[j].color));
      if (white.length >= 2 && white.length === fill.length) continue;
      const replacement = white.length >= 2 ? white[0] : firstMin(fill, (a, b) => dist2(color, pixels[a].color) < dist2(color, pixels[b].color));

function berrySwatch(c, isInk) {
  if (isInk) return [Math.max(F(0.257), Math.min(c[0], F(0.33))), F(0.043), F(-0.042)];

  const strength = Math.min(1, Math.max(0, F(F(chromaV - F(0.017)) / F(0.038))));
  const shadow = Math.min(1, Math.max(0, F(F(F(0.87) - c[0]) / F(0.40))));
  const violet = c[1] > F(0.018) && c[2] < F(-0.022) && -c[2] > F(c[1] * F(0.5));
  const pinkLab = c[1] > F(0.035) && Math.abs(c[2]) <= F(c[1] * F(0.5));

  if (violet) delta = [F(F(c[0] - F(0.67)) * F(0.16)), F(c[1] * F(0.13)), F(F(c[2] * F(0.35)) - F(0.007))];

  else delta = [0, F(F(c[1] * F(0.15)) + F(F(0.012) * shadow)), F(F(c[2] * F(0.15)) - F(F(0.016) * shadow))];

function blendSmallPalePatches(labels, palette, whiteIndex, width, height, skipInk) {

  for (let i = 0; i < labels.length; i++) {
    if (labels[i] !== whiteIndex || visited[i]) continue;
    const cells = [i];
    visited[i] = 1;
    let touchesExterior = false;
    const contacts = new Array(palette.length).fill(0);
    for (let head = 0; head < cells.length; head++) {
      const j = cells[head], x = j % width, y = (j / width) | 0;
      for (const [u, v] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {

    for (let k = 1; k < contacts.length; k++) if (contacts[best] < contacts[k]) best = k;

    const replacement = contacts.length && !touchesExterior && possible.has(best) && contacts[best] >= 4 && contacts[best] * 3 >= total * 2 ? best : null;
    patches.push({ cells, replacement });
  }
  const limit = Math.min(Math.floor(big / 4), Math.max(4, Math.floor(labels.length / 40)));
  for (const patch of patches) {
    if (patch.cells.length <= limit && patch.replacement !== null) for (const i of patch.cells) labels[i] = patch.replacement;
  }

// ── 원본 대조 보정
const isDarkLab = c => { const ch = len2(c[1], c[2]); return (c[0] < F(0.42) && ch < F(0.06)) || (c[0] < K035 && ch < F(0.12)); };

function commonest(points) {
  // 칸 번호 (x, y, z)를 숫자 하나로: 사전 순서와 숫자 크기 순서가 같다(각 성분 ±512 안쪽).
  const bins = new Map();
  for (const p of points) {
    const key = ((roundAway(F(p[0] / F(0.04))) + 512) * 1024 + roundAway(F(p[1] / F(0.03))) + 512) * 1024 + roundAway(F(p[2] / F(0.03))) + 512;
    let bin = bins.get(key);
    if (!bin) bins.set(key, bin = { t0: 0, t1: 0, t2: 0, count: 0 });
    bin.t0 = F(bin.t0 + p[0]); bin.t1 = F(bin.t1 + p[1]); bin.t2 = F(bin.t2 + p[2]);
    bin.count++;
  }
  let best = null, bestKey = 0;
  for (const [key, bin] of bins) {
    if (!best || bin.count > best.count || (bin.count === best.count && key < bestKey)) { best = bin; bestKey = key; }
  }
  return [F(best.t0 / best.count), F(best.t1 / best.count), F(best.t2 / best.count)];
}

function evidenceFor(prepared, size, shift) {
  const f = fit(prepared.w, prepared.h, size.w, size.h);
  const w = f.w, h = f.h, side = 8;
  const frame = { width: w, height: h, xOffset: Math.trunc((size.w - w) / 2), yOffset: Math.trunc((size.h - h) / 2) };
  const bytes = rasterize(prepared, w * side, h * side, { x: shift[0] * 2, y: shift[1] * 2, w: w * side, h: h * side });
  const stride = w * side * 4;
  const dark = new Float32Array(w * h), color = Array.from({ length: w * h }, ZERO), opaque = new Array(w * h).fill(false);
  const samples = Array.from({ length: w * h }, () => []);
  for (let cy = 0; cy < h; cy++) {
    for (let cx = 0; cx < w; cx++) {
      const points = [], sparse = [];
      for (let sy = 0; sy < side; sy++) for (let sx = 0; sx < side; sx++) {
        const o = (cy * side + sy) * stride + (cx * side + sx) * 4, alpha = bytes[o + 3];
        if (!(alpha > 127)) continue;
        const lab = decodeLab(bytes[o], bytes[o + 1], bytes[o + 2], alpha);
        points.push(lab);
        if (sx % 2 === 0 && sy % 2 === 0) sparse.push(lab);
      }
      const i = cy * w + cx;
      const coverage = F(points.length / (side * side));
      opaque[i] = coverage >= F(0.5);
      if (points.length === 0) continue;
      const darkPoints = points.filter(isDarkLab);
      dark[i] = F(F(darkPoints.length / points.length) * coverage);
      const body = points.length - darkPoints.length >= 4 ? points.filter(p => !isDarkLab(p)) : points;
      color[i] = commonest(body);
      samples[i] = sparse;
    }
  }

}

function correctLabels(labels, palette, evidence, summary) {
  const w = evidence.frame.width, h = evidence.frame.height;
  const result = labels.slice();

// ── 선 1px로 다듬기

// ── 바깥 테두리를 순검정 1px로

// ── 베리 잉크 전체

  const size = { w, h };

  const aligned = bestGrid(prepared, size);
  const offset = [aligned[0], -aligned[1]];
  let conversion = convertBerry(prepared, size, Math.max(2, Math.min(64, settings.colors - (settings.boundary ? 2 : 1))), offset);

function finishLegacy(converted, settings, lines) {

// ───────────────────────────── 원본 색 살림 (개선판 '약하게 · 원본 색 살림')
// 배경 정리 → 칸마다 대표 색 → 색 수만큼 팔레트 → 원본 대조 보정. 외곽선을 따로 씌우지 않아 원본 선을 그대로 살린다.

  const size = { w, h };
  const prepared = withoutLightBackground(subject.image());
  const fitted = fit(prepared.w, prepared.h, w, h);
  const side = 4, sw = fitted.w * side, sh = fitted.h * side;

  const palette = buildPalette(pixels, Math.max(2, Math.min(64, settings.softColors)));
  const encoded = palette.map(encodeSRGB);
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < fitted.h; y++) for (let x = 0; x < fitted.w; x++) {
    const pixel = pixels[y * fitted.w + x];
    const alpha = roundAway(F(pixel.alpha * 255));
    if (!(alpha > 0) || palette.length === 0) continue;
    const rgb = encoded[nearestLab(pixel.color, palette)];
    const o = ((y + fitted.top) * w + x + fitted.x) * 4;
    out[o] = Math.floor((rgb[0] * alpha + 127) / 255);
    out[o + 1] = Math.floor((rgb[1] * alpha + 127) / 255);

  const image = Raster.fromPremultiplied(checked.data, w, h);

/**
 * 색 면 정리(원본 색 살림): 거의 같은 색(OKLab 거리 0.035 미만)을 더 많이 쓰인 색으로 합치고,
 * 같은 색 이웃이 하나도 없는 점은 둘레 다수 색(8칸 중 5칸 이상)으로 메운다. 선(진한 색)끼리는 합치지 않는다.

  const px = image.px, isInk = LineCleanup.isInk;

  for (const p of px) if (A(p) > 0) counts.set(KEY(p), (counts.get(KEY(p)) ?? 0) + 1);

  for (const p of sorted) {
    if (isInk(p)) { map.set(KEY(p), p); continue; }
    const c = decodeLab(R(p), G(p), B(p), 255);
    const rep = reps.find(r => Math.hypot(r.c[0] - c[0], r.c[1] - c[1], r.c[2] - c[2]) < threshold);

    grid.each8(i, j => {

      if (KEY(before[j]) === KEY(before[i])) same++;
      else votes.set(KEY(before[j]), (votes.get(KEY(before[j])) ?? 0) + 1);

    const [k, n] = [...votes.entries()].sort((a, b) => b[1] - a[1])[0];
    if (n >= 5) px[i] = withAlpha(keyPixel(k), A(before[i]));

}

/**
 * 선 1픽셀 정리(원본 색 살림): 큰 원본에서 선의 가운데 줄기(뼈대)를 먼저 찾고, 그 줄기가 지나는 칸만 선으로 칠한다.
 * 작게 줄인 뒤 깎는 것보다 입(ω) 같은 작은 굴곡이 살아 있고, 선이 끊기거나 뭉치지 않는다. 새 색은 만들지 않는다.

/** 선명하게: OKLab 채도를 factor배로. 흰색·검정·회색(채도 0.02 미만)은 그대로, 알파도 그대로. */

    const p = image.px[i];

    let rgb = cache.get(KEY(p));
    if (rgb === undefined) {
      const [L, a, b] = decodeLab(R(p), G(p), B(p), 255);
      rgb = Math.hypot(a, b) < 0.02 ? null : oklabToRGB(L, a * factor, b * factor);

/** OKLab → sRGB 바이트(배정밀도, 범위 밖은 자름) */
function oklabToRGB(L, a, b) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  const linear = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
  return linear.map(v => {
    v = Math.min(1, Math.max(0, v));
    return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055));

// ───────────────────────────── 원본 보존 (맥 시험판 DotMaker 100-100에서 옮김)
// 원본 픽셀이 최종 격자 한 칸에 걸치는 넓이만큼 그대로 평균 낸다(중간 축소 없음).

/** 원본 칸이 목표 칸에 걸치는 길이. 단위는 목표 칸 하나 = source. */
function overlaps(source, target) {
  return Array.from({ length: target }, (_, cell) => {
    const start = cell * source, end = (cell + 1) * source, list = [];
    for (let pixel = Math.floor(start / target); pixel <= Math.floor((end - 1) / target); pixel++) {
      list.push([pixel, Math.min(end, (pixel + 1) * target) - Math.max(start, pixel * target)]);
    }
    return list;
  });
}

function reduceDirect(subject, w, h) {
  if (!(w >= 16 && w <= 512 && h >= 16 && h <= 512)) fail('dimensions');
  const scale = Math.min((w - 4) / subject.grid.w, (h - 4) / subject.grid.h);
  const sw = Math.max(1, Math.round(subject.grid.w * scale));
  const sh = Math.max(1, Math.round(subject.grid.h * scale));
  const x = Math.trunc((w - sw) / 2), y = Math.trunc((h - sh) / 2);
  const columns = overlaps(subject.grid.w, sw), rows = overlaps(subject.grid.h, sh);
  const area = subject.grid.w * subject.grid.h, sp = subject.px, sW = subject.grid.w;

      const average = new Acc(), fill = new Acc(), ink = new Acc(), accent = new Acc();
      for (const [row, rowLength] of rows[v]) {
        for (const [column, columnLength] of columns[u]) {
          const p = sp[row * sW + column];
          if (A(p) === 0) continue;
          const weight = rowLength * columnLength;
          average.add(p, weight);
          if (light(p) < 110) ink.add(p, weight); else fill.add(p, weight);
          if (chroma(p) >= 28 && light(p) >= 100) accent.add(p, weight);

      const cover = Math.floor(average.weight / area);
      if (!(cover > 0)) continue;
      const dark = Math.floor(ink.weight * 100 / average.weight);
      const accentShare = Math.floor(accent.weight * 100 / average.weight);
      const mean = average.color, fillColor = fill.weight === 0 ? mean : fill.color;
      const i = (v + y) * w + u + x;
      cells[i] = { fill: fillColor, ink: ink.color, cover, dark, accent: accentShare, accentColor: accent.color };
      // 여러 원본 픽셀이 받치는 선은 대비를 되살린다.
      const p = dark >= 25 && dark < 75 && cover >= 150 ? mixed(mean, ink.color, Math.trunc((dark - 20) / 2)) : mean;

/**
 * 축소 평균 때문에 경계에 생긴 탁한 중간색(빨강+검정 → 자주) 칸마다, 사이에 낀 두 이웃 색 중

    for (let m = 0; m < around.length; m++) {
      for (let n = m + 1; n < around.length; n++) {
        const a = vec(around[m]), b = vec(around[n]), ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];

        const t = (ca[0] * ab[0] + ca[1] * ab[1] + ca[2] * ab[2]) / (gap * gap);

/**
