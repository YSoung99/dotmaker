# PR·푸시마다: 스냅샷 테스트와 Windows 설치판의 화면·저장 검증
name: 빌드·테스트

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/imago/go.mod
          cache-dependency-path: tools/imago/go.sum
      - run: npm ci --ignore-scripts
      - run: node tools/build.mjs
      - run: npm test

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/imago/go.mod
          cache-dependency-path: tools/imago/go.sum
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm test
      - run: node test/windows-install-smoke.cjs
